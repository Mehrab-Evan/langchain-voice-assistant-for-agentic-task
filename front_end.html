<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diamond Kebab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --char:   #17150F;
    --ash:    #262218;
    --ember:  #E9A62B;
    --pom:    #B8324A;
    --paper:  #F1EADB;
    --muted:  #9A9280;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--char);
    color: var(--paper);
    font-family: "Archivo", system-ui, sans-serif;
    font-variation-settings: "wdth" 100, "wght" 400;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
  }

  .shop {
    width: min(680px, 100%);
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ---------- header ---------- */

  header {
    padding: 18px 20px 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid #342E20;
    /* grill grate */
    background:
      repeating-linear-gradient(90deg,
        transparent 0 13px, #221D14 13px 14px)
      bottom / 100% 6px no-repeat;
  }

  .wordmark {
    margin: 0;
    font-size: 26px;
    font-variation-settings: "wdth" 88, "wght" 800;
    letter-spacing: -0.02em;
  }

  .wordmark span { color: var(--ember); }

  .hours {
    font-size: 13px;
    color: var(--muted);
  }

  .hours b {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ember);
    margin-right: 6px;
    vertical-align: 1px;
  }

  /* ---------- transcript ---------- */

  #log {
    overflow-y: auto;
    overflow-wrap: anywhere;
    padding: 22px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: #3A3325 transparent;
  }

  .msg {
    max-width: 84%;
    padding: 11px 15px;
    white-space: pre-wrap;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--paper);
    color: #1C1810;
    border-radius: var(--radius) var(--radius) var(--radius) 3px;
  }

  .msg.me {
    align-self: flex-end;
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--ember);
    border-radius: var(--radius) var(--radius) 3px var(--radius);
  }

  .msg.bad {
    align-self: flex-start;
    color: #FFC9D2;
    border-left: 3px solid var(--pom);
    padding-left: 12px;
  }

  .msg code {
    font-family: ui-monospace, monospace;
    font-size: 0.92em;
    background: #00000018;
    padding: 1px 4px;
    border-radius: 4px;
  }

  /* ---------- empty state ---------- */

  .board {
    margin: auto 0;
    text-align: left;
  }

  .board p {
    margin: 0 0 18px;
    font-size: 21px;
    font-variation-settings: "wdth" 92, "wght" 600;
    max-width: 22ch;
    line-height: 1.25;
  }

  .starters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .starters button {
    font: inherit;
    font-size: 14px;
    color: var(--paper);
    background: var(--ash);
    border: 1px solid #3D3627;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }

  .starters button:hover { border-color: var(--ember); }

  /* ---------- coals (thinking) ---------- */

  .coals {
    align-self: flex-start;
    display: flex;
    gap: 5px;
    padding: 6px 2px;
  }

  .coals i {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4A4231;
    animation: glow 1.1s infinite ease-in-out;
  }

  .coals i:nth-child(2) { animation-delay: .18s; }
  .coals i:nth-child(3) { animation-delay: .36s; }

  @keyframes glow {
    0%, 70%, 100% { background: #4A4231; }
    35%           { background: var(--ember); }
  }

  /* ---------- composer ---------- */

  form {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid #342E20;
  }

  textarea {
    flex: 1;
    font: inherit;
    color: var(--paper);
    background: var(--ash);
    border: 1px solid #3D3627;
    border-radius: 12px;
    padding: 11px 14px;
    resize: none;
    max-height: 140px;
    min-height: 44px;
  }

  textarea::placeholder { color: #6E6656; }

  button.send {
    font: inherit;
    font-variation-settings: "wght" 700;
    color: #1C1810;
    background: var(--ember);
    border: 0;
    border-radius: 12px;
    padding: 0 20px;
    height: 44px;
    cursor: pointer;
  }

  button.send:disabled {
    background: #4A4231;
    color: #8A8271;
    cursor: default;
  }

  :focus-visible {
    outline: 2px solid var(--ember);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .coals i { animation: none; background: var(--ember); }
  }
</style>
</head>
<body>

<main class="shop">
  <header>
    <h1 class="wordmark">Diamond <span>Kebab</span></h1>
    <p class="hours"><b></b>Grill is on</p>
  </header>

  <div id="log" role="log" aria-live="polite">
    <div class="board" id="board">
      <p>Ask about the menu, or just tell us what you're hungry for.</p>
      <div class="starters">
        <button type="button">What's on the menu?</button>
        <button type="button">Something spicy, no beef</button>
        <button type="button">I want to order for two</button>
      </div>
    </div>
  </div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Type your order…"
              autocomplete="off" aria-label="Message"></textarea>
    <button class="send" type="submit" id="send">Send</button>
  </form>
</main>

<script>
const API = "";                    // same origin; set to "http://localhost:8000" if hosted apart
const log      = document.getElementById("log");
const board    = document.getElementById("board");
const form     = document.getElementById("composer");
const input    = document.getElementById("input");
const sendBtn  = document.getElementById("send");

let sessionId = null;
let busy = false;

try { sessionId = sessionStorage.getItem("dk_session"); } catch (_) {}

/* --- rendering --- */

function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}

// Minimal markdown: **bold**, *italic*, `code`
function render(text) {
  return esc(text)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|\W)\*([^*\n]+)\*/g, "$1<i>$2</i>");
}

function bubble(text, kind) {
  board?.remove();
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.innerHTML = kind === "me" ? esc(text) : render(text);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function coals() {
  const el = document.createElement("div");
  el.className = "coals";
  el.innerHTML = "<i></i><i></i><i></i>";
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

/* --- sending --- */

async function send(text) {
  if (busy || !text.trim()) return;
  busy = true;
  sendBtn.disabled = true;

  bubble(text, "me");
  input.value = "";
  input.style.height = "auto";
  const waiting = coals();

  try {
    const res = await fetch(API + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId })
    });

    const data = await res.json().catch(() => ({}));
    waiting.remove();

    if (!res.ok) {
      bubble(data.detail || "That didn't go through. Try sending it again.", "bad");
    } else {
      sessionId = data.session_id;
      try { sessionStorage.setItem("dk_session", sessionId); } catch (_) {}
      bubble(data.reply, "bot");
    }
  } catch (_) {
    waiting.remove();
    bubble("Can't reach the shop. Check that the server is running on port 8000.", "bad");
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

/* --- wiring --- */

form.addEventListener("submit", e => { e.preventDefault(); send(input.value); });

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

document.querySelectorAll(".starters button").forEach(b =>
  b.addEventListener("click", () => send(b.textContent))
);

input.focus();
</script>
</body>
</html>
